name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Git Checkout
        uses: actions/checkout@v7

      - name: Setup Bicep
        uses: ./

      - name: Verify Bicep
        shell: bash
        run: |
          bicep --version
          resolved="$(command -v bicep)"
          echo "Resolved bicep to: $resolved"
          if ! grep -Eqi 'hostedtoolcache.*/bicep/' <<< "$resolved"; then
            echo "::error::bicep on PATH ('$resolved') is not the setup-bicep install; a pre-existing bicep is shadowing it."
            exit 1
          fi